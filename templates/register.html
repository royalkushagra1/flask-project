<!DOCTYPE html>
<html>
<head>
    <title>Create Account - CricketHub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .auth-card {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            color: #0f4c5c;
            margin-bottom: 5px;
        }

        .brand p {
            color: #777;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0f4c5c;
        }

        button {
            width: 100%;
            padding: 12px;

            background: #0f4c5c;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b3b47;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #0f4c5c;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="auth-card">

        <div class="brand">
            <h1>🏏 CricketHub</h1>
            <p>Create your account</p>
        </div>

        <form method="POST">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </div>

</body>
</html>
